      const touchEndX = useRef(0);

      // Handle keyboard navigation for Lightbox
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!lightboxState.isOpen) return;
          if (e.key === 'Escape') closeLightbox();
          if (e.key === 'ArrowLeft') prevLightboxImage();
          if (e.key === 'ArrowRight') nextLightboxImage();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [lightboxState]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();

      });

      // Update active nav link on scroll
      useEffect(() => {
        const handleScroll = () => {
          const sections = ['inicio', 'essencia', 'servicos', 'portfolio', 'nossa-casa', 'jornada', 'contato'];
          const scrollPos = window.scrollY + 140;

          for (const sectionId of sections) {
            const el = document.getElementById(sectionId);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPos >= top && scrollPos < top + height) {
                setActiveSection(sectionId);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const nextProjectSlide = (projectId, totalImages) => {
        setProjectSlideIndices(prev => ({
          ...prev,
          [projectId]: (prev[projectId] + 1) % totalImages
        }));
      };

      const prevProjectSlide = (projectId, totalImages) => {
        setProjectSlideIndices(prev => ({
          ...prev,
          [projectId]: (prev[projectId] - 1 + totalImages) % totalImages
        }));
      };

      // Touch handlers for project swipe
      const handleProjectTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
      };

      const handleProjectTouchEnd = (e, projectId, totalImages) => {
        touchEndX.current = e.changedTouches[0].clientX;
        const diff = touchStartX.current - touchEndX.current;
        if (Math.abs(diff) > 45) {
          if (diff > 0) {
            nextProjectSlide(projectId, totalImages);
          } else {
            prevProjectSlide(projectId, totalImages);
          }
        }
      };

      const nextOfficeSlide = () => {
        setOfficeSlideIndex(prev => (prev + 1) % OFFICE_PHOTOS.length);
      };

        setOfficeSlideIndex(prev => (prev - 1 + OFFICE_PHOTOS.length) % OFFICE_PHOTOS.length);

        touchEndX.current = e.changedTouches[0].clientX;
        const diff = touchStartX.current - touchEndX.current;
